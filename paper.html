<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Cake Promotional Flyer & Banner</title>
    <!-- Tailwind CSS for modern responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for handwriting and bold styles -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plum: {
                            900: '#380027',
                            800: '#4a0836',
                            700: '#5c0f45',
                        },
                        hotpink: '#ff1493',
                        bubblegum: '#ff69b4',
                    }
                }
            }
        }
    </script>
    <style>
        .font-handwriting {
            font-family: 'Caveat', cursive;
        }
        .font-display {
            font-family: 'Fredoka', sans-serif;
        }
        .font-sans {
            font-family: 'Poppins', sans-serif;
        }
        /* Custom scrollbar for editor panel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2d0620;
        }
        ::-webkit-scrollbar-thumb {
            background: #5c0f45;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff1493;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col lg:flex-row">

    <!-- SIDEBAR CONTROLS & EDITOR PANEL -->
    <div class="w-full lg:w-[420px] bg-plum-900 border-r border-plum-700 p-6 flex flex-col justify-between shadow-2xl z-20 overflow-y-auto max-h-screen">
        <div>
            <!-- App Header -->
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-plum-700">
                <div class="bg-hotpink text-white p-3 rounded-2xl shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-cake-candles text-xl"></i>
                </div>
                <div>
                    <h1 class="font-display font-bold text-xl text-white tracking-wide">Cake Flyer Studio</h1>
                    <p class="text-xs text-pink-300">Fully Editable Layout & Export</p>
                </div>
            </div>

            <!-- Editor Accordion Sections -->
            <div class="space-y-6">
                <!-- Section 1: Header Info -->
                <div class="bg-plum-800/80 p-4 rounded-2xl border border-plum-700 shadow-inner">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-pink-300 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-heading"></i> 1. Top Header
                    </h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Logo Text</label>
                            <input type="text" id="inputLogoText" value="Logo Here" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Main Heading -->
                <div class="bg-plum-800/80 p-4 rounded-2xl border border-plum-700 shadow-inner">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-pink-300 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-font"></i> 2. Main Title
                    </h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Subtitle (Handwritten)</label>
                            <input type="text" id="inputSubtitle" value="What is your Favorite" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Big Title (Bold Pink)</label>
                            <input type="text" id="inputBigTitle" value="CAKE?" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition font-bold">
                        </div>
                    </div>
                </div>

                <!-- Section 3: Call to Action Button -->
                <div class="bg-plum-800/80 p-4 rounded-2xl border border-plum-700 shadow-inner">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-pink-300 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-bolt"></i> 3. Button & Badge
                    </h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Button Text</label>
                            <input type="text" id="inputButtonText" value="Order Now" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Bubble Text (Left)</label>
                            <input type="text" id="inputBubbleText" value="We Bring it To You!" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition">
                        </div>
                    </div>
                </div>

                <!-- Section 4: Footer Contact -->
                <div class="bg-plum-800/80 p-4 rounded-2xl border border-plum-700 shadow-inner">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-pink-300 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-address-book"></i> 4. Contact Footer
                    </h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Phone Number</label>
                            <input type="text" id="inputPhone" value="123-456-7890" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Website Handle</label>
                            <input type="text" id="inputWebsite" value="@reallygreatsite" class="w-full bg-plum-900 border border-plum-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-hotpink transition">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export Action Buttons -->
        <div class="mt-8 pt-4 border-t border-plum-700 flex flex-col gap-3">
            <button id="btnReset" class="w-full bg-plum-800 hover:bg-plum-700 text-pink-200 font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 border border-plum-700 shadow">
                <i class="fa-solid fa-rotate-right"></i> Reset Defaults
            </button>
            <button id="btnDownload" class="w-full bg-gradient-to-r from-pink-600 to-hotpink hover:from-pink-500 hover:to-pink-600 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-download"></i> Save / Print Flyer
            </button>
        </div>
    </div>

    <!-- PREVIEW AREA (FLYER CANVAS) -->
    <div class="flex-1 bg-slate-900 flex items-center justify-center p-4 sm:p-8 overflow-auto">
        
        <!-- Flyer Container matching 9:16 aspect ratio vertical banner -->
        <div id="flyerContainer" class="relative w-full max-w-[420px] h-[750px] bg-plum-900 rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between border-4 border-plum-700 select-none">
            
            <!-- Organic background shapes (decorative waves/blobs) -->
            <div class="absolute -top-24 -right-24 w-72 h-72 bg-plum-800/60 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute top-1/3 -left-32 w-80 h-80 bg-plum-700/40 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-plum-800/50 rounded-full blur-3xl pointer-events-none"></div>

            <!-- TOP HEADER -->
            <div class="relative z-10 pt-6 px-6 flex justify-center items-center">
                <div class="inline-flex items-center gap-2 bg-hotpink/90 backdrop-blur-sm px-4 py-1.5 rounded-full shadow-md border border-pink-400/30">
                    <div class="w-6 h-6 rounded-full bg-white flex items-center justify-center text-hotpink shadow-inner text-xs">
                        <i class="fa-solid fa-cake-candles"></i>
                    </div>
                    <span id="displayLogoText" class="text-white text-xs font-semibold tracking-wider">Logo Here</span>
                </div>
            </div>

            <!-- MAIN HEADLINE SECTION -->
            <div class="relative z-10 text-center px-4 pt-2">
                <h3 id="displaySubtitle" class="font-handwriting text-2xl sm:text-3xl text-pink-200 tracking-wide drop-shadow">What is your Favorite</h3>
                <h1 id="displayBigTitle" class="font-display font-black text-5xl sm:text-6xl text-hotpink uppercase tracking-wider drop-shadow-lg transform -rotate-1">CAKE?</h1>
                
                <!-- Order Now Button -->
                <div class="mt-4 flex justify-center">
                    <button id="displayButton" class="bg-hotpink hover:bg-pink-600 text-white font-bold py-2.5 px-8 rounded-full shadow-lg border border-pink-300/40 text-sm tracking-wide transform hover:scale-105 transition duration-200">
                        Order Now
                    </button>
                </div>
            </div>

            <!-- CENTRAL ILLUSTRATIONS & COMIC BUBBLE -->
            <div class="relative z-10 flex-1 flex items-end px-4 pb-4">
                
                <!-- Left Comic Bubble -->
                <div class="absolute left-6 bottom-48 z-20 animate-pulse">
                    <div class="relative bg-plum-900 border-4 border-hotpink p-3.5 rounded-3xl shadow-2xl max-w-[130px] text-center transform -rotate-6">
                        <p id="displayBubbleText" class="font-handwriting text-lg text-white font-bold leading-tight">We Bring it To You!</p>
                        <!-- Bubble tail -->
                        <div class="absolute -bottom-3 left-8 w-4 h-4 bg-plum-900 border-r-4 border-b-4 border-hotpink transform rotate-45"></div>
                    </div>
                </div>

                <!-- Cakes & Cupcakes Illustration Composition -->
                <div class="w-full relative h-[260px] flex items-end justify-center">
                    
                    <!-- Bunny Decoration Stick on back right cake -->
                    <div class="absolute right-20 top-2 z-30 flex flex-col items-center animate-bounce duration-1000">
                        <div class="w-10 h-10 rounded-full bg-amber-50 border-2 border-amber-200 flex flex-col items-center justify-center shadow-lg relative">
                            <!-- Bunny ears -->
                            <div class="absolute -top-4 -left-1.5 w-3 h-5 bg-pink-200 rounded-t-full transform -rotate-12 border border-amber-200"></div>
                            <div class="absolute -top-4 -right-1.5 w-3 h-5 bg-pink-200 rounded-t-full transform rotate-12 border border-amber-200"></div>
                            <!-- Face -->
                            <div class="flex gap-1.5 mb-0.5">
                                <div class="w-1 h-1 bg-slate-800 rounded-full"></div>
                                <div class="w-1 h-1 bg-slate-800 rounded-full"></div>
                            </div>
                            <div class="w-1.5 h-1 bg-pink-400 rounded-full"></div>
                        </div>
                        <div class="w-1 h-20 bg-amber-200 shadow"></div>
                    </div>

                    <!-- Sparkles / Motion lines -->
                    <div class="absolute right-12 top-10 flex gap-1 opacity-80">
                        <div class="w-0.5 h-6 bg-white transform -rotate-12"></div>
                        <div class="w-0.5 h-8 bg-white transform -rotate-6"></div>
                        <div class="w-0.5 h-6 bg-white"></div>
                    </div>

                    <!-- Right Side Large Chocolate Cake -->
                    <div class="absolute right-0 bottom-12 w-48 h-32 bg-amber-900 rounded-t-3xl rounded-b-xl border-t-4 border-amber-700 shadow-2xl flex flex-col items-center overflow-hidden">
                        <!-- Chocolate frosting glaze dripping -->
                        <div class="w-full h-10 bg-amber-950 rounded-b-2xl relative shadow-inner"></div>
                        <!-- Mint leaves & raspberries garnish -->
                        <div class="absolute top-4 right-10 z-10 flex items-center">
                            <!-- Mint leaf -->
                            <div class="w-10 h-6 bg-emerald-500 rounded-full transform rotate-45 border border-emerald-400 shadow"></div>
                            <!-- Raspberry cluster -->
                            <div class="absolute -left-3 top-1 w-7 h-7 bg-red-600 rounded-full border-2 border-red-500 shadow-md flex items-center justify-center">
                                <div class="w-2 h-2 bg-red-400 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Left Side Layer Cake with Strawberry -->
                    <div class="absolute left-4 bottom-8 w-44 h-28 bg-amber-900 rounded-t-2xl rounded-b-lg border-t-4 border-amber-700 shadow-xl flex flex-col overflow-hidden">
                        <!-- Filling layer -->
                        <div class="w-full h-6 bg-amber-200/90 my-3"></div>
                        <!-- Chocolate frosting top -->
                        <div class="absolute top-0 w-full h-8 bg-amber-950 rounded-b-xl"></div>
                        <!-- Big Fresh Strawberry Garnish -->
                        <div class="absolute top-1 left-12 z-20">
                            <div class="w-10 h-12 bg-red-600 rounded-b-full rounded-t-lg shadow-lg relative transform -rotate-12 border border-red-400">
                                <!-- Strawberry stem -->
                                <div class="absolute -top-2 left-3 w-4 h-3 bg-emerald-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Cupcake Row (Front) -->
                    <div class="absolute bottom-0 w-full flex justify-between px-1 z-35">
                        
                        <!-- Cupcake 1: Pink Frosting with Choco chunks -->
                        <div class="flex flex-col items-center">
                            <div class="w-12 h-10 bg-pink-500 rounded-t-full shadow-md relative flex items-center justify-center">
                                <div class="absolute -top-2 w-3 h-3 bg-amber-950 rounded"></div>
                                <div class="absolute top-1 -left-1 w-2.5 h-2.5 bg-amber-950 rounded"></div>
                                <div class="absolute top-2 right-0 w-3 h-2 bg-amber-950 rounded"></div>
                            </div>
                            <div class="w-10 h-8 bg-amber-200 rounded-b-lg border-t border-amber-300 shadow flex flex-col items-center justify-around py-0.5">
                                <div class="w-full h-0.5 bg-amber-300"></div>
                                <div class="w-full h-0.5 bg-amber-300"></div>
                            </div>
                        </div>

                        <!-- Cupcake 2: Cream & Strawberry -->
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-9 bg-amber-100 rounded-t-full shadow-md relative flex items-center justify-center border-t-2 border-white">
                                <div class="absolute -top-3 w-5 h-5 bg-red-600 rounded-full border border-red-500"></div>
                            </div>
                            <div class="w-12 h-9 bg-amber-700 rounded-b-lg border-t border-amber-800 shadow"></div>
                        </div>

                        <!-- Cupcake 3: Cream & Strawberry -->
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-9 bg-amber-100 rounded-t-full shadow-md relative flex items-center justify-center border-t-2 border-white">
                                <div class="absolute -top-3 w-5 h-5 bg-red-600 rounded-full border border-red-500"></div>
                            </div>
                            <div class="w-12 h-9 bg-amber-700 rounded-b-lg border-t border-amber-800 shadow"></div>
                        </div>

                        <!-- Cupcake 4: Chocolate Drizzle -->
                        <div class="flex flex-col items-center">
                            <div class="w-16 h-10 bg-amber-950 rounded-t-full shadow-md relative">
                                <div class="absolute top-0 w-full h-4 bg-amber-900 rounded-t-full"></div>
                            </div>
                            <div class="w-14 h-9 bg-pink-100 rounded-b-lg border-t border-pink-200 shadow"></div>
                        </div>

                    </div>

                </div>

            </div>

            <!-- BOTTOM CONTACT BAR -->
            <div class="relative z-10 bg-hotpink py-3 px-6 flex items-center justify-between shadow-2xl border-t border-pink-400">
                <div class="flex items-center gap-2 text-white text-xs font-semibold">
                    <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-phone text-xs"></i>
                    </div>
                    <span id="displayPhone">123-456-7890</span>
                </div>
                <div class="flex items-center gap-2 text-white text-xs font-semibold">
                    <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-globe text-xs"></i>
                    </div>
                    <span id="displayWebsite">@reallygreatsite</span>
                </div>
            </div>

        </div>

    </div>

    <!-- NOTIFICATION MODAL -->
    <div id="notificationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-plum-900 border border-plum-700 p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300" id="modalCard">
            <div class="w-12 h-12 bg-hotpink text-white rounded-full flex items-center justify-center mx-auto mb-4 text-xl shadow-lg">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modalTitle" class="font-display font-bold text-lg text-white mb-2">Success!</h3>
            <p id="modalMessage" class="text-xs text-slate-300 mb-6">Your flyer has been prepared successfully.</p>
            <button id="closeModal" class="w-full bg-hotpink hover:bg-pink-600 text-white font-semibold py-2.5 rounded-xl transition shadow">
                Got it
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC FOR LIVE BINDING & EXPORT -->
    <script>
        // Mapping input fields to live preview elements
        const mappings = [
            { input: 'inputLogoText', display: 'displayLogoText' },
            { input: 'inputSubtitle', display: 'displaySubtitle' },
            { input: 'inputBigTitle', display: 'displayBigTitle' },
            { input: 'inputButtonText', display: 'displayButton' },
            { input: 'inputBubbleText', display: 'displayBubbleText' },
            { input: 'inputPhone', display: 'displayPhone' },
            { input: 'inputWebsite', display: 'displayWebsite' },
        ];

        // Real-time synchronization
        mappings.forEach(item => {
            const inputEl = document.getElementById(item.input);
            const displayEl = document.getElementById(item.display);

            inputEl.addEventListener('input', () => {
                displayEl.textContent = inputEl.value;
            });
        });

        // Reset Defaults button
        document.getElementById('btnReset').addEventListener('click', () => {
            const defaults = {
                inputLogoText: 'Logo Here',
                inputSubtitle: 'What is your Favorite',
                inputBigTitle: 'CAKE?',
                inputButtonText: 'Order Now',
                inputBubbleText: 'We Bring it To You!',
                inputPhone: '123-456-7890',
                inputWebsite: '@reallygreatsite'
            };

            for (const [id, val] of Object.entries(defaults)) {
                const inp = document.getElementById(id);
                inp.value = val;
                inp.dispatchEvent(new Event('input'));
            }

            showModal('Reset Successful', 'All fields have been restored to their original layout values.');
        });

        // Download / Export Feature (Triggers browser print dialog formatted for flyer saving)
        document.getElementById('btnDownload').addEventListener('click', () => {
            showModal('Export Ready', 'Opening print preview. You can choose "Save as PDF" to download your customized flyer!');
            setTimeout(() => {
                window.print();
            }, 1000);
        });

        // Modal Helpers
        const modal = document.getElementById('notificationModal');
        const modalCard = document.getElementById('modalCard');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        document.getElementById('closeModal').addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        });
    </script>
</body>
</html>
